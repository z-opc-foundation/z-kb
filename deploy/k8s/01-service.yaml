# ============================================================
# z-***REMOVED*** —— Service（NodePort）
# 线上实况（/tmp/zdeploy-base/z-***REMOVED***.yaml 导出为准）：
#   Service  z-***REMOVED***-server  NodePort  8889 → targetPort http  nodePort 31889
#   selector app.kubernetes.io/name=z-***REMOVED***-server
#
# 端口与 NodePort 号**照抄线上**，不重新分配（改号会让既有调用方失联，收益为零）。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: z-***REMOVED***-server
  namespace: z-***REMOVED***
  labels:
    app.kubernetes.io/name: z-***REMOVED***-server
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: z-***REMOVED***-server
  ports:
    - name: http
      port: 8889
      targetPort: http
      nodePort: 31889
