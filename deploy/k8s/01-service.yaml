# ============================================================
# z-kb —— Service（NodePort）
# 线上实况（/tmp/zdeploy-base/z-kb.yaml 导出为准）：
#   Service  z-kb-server  NodePort  8889 → targetPort http  nodePort 31889
#   selector app.kubernetes.io/name=z-kb-server
#
# 端口与 NodePort 号**照抄线上**，不重新分配（改号会让既有调用方失联，收益为零）。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: z-kb-server
  namespace: z-kb
  labels:
    app.kubernetes.io/name: z-kb-server
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: z-kb-server
  ports:
    - name: http
      port: 8889
      targetPort: http
      nodePort: 31889
