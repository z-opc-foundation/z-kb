server:
  port: 8889
  servlet:
    context-path: /
  compression:
    enabled: true

spring:
  application:
    name: z-kb
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ==================== z-kb 配置 ====================
zkb:
  enabled: true
  embedding:
    # tfidf = 本地 TF-IDF 实现（自包含，离线可用）
    # http  = 调用 OpenAI/Qwen/GLM 等兼容端点
    provider: tfidf
    dimension: 512
    # endpoint: http://localhost:11434/v1/embeddings   # Ollama 示例
    # model: nomic-embed-text
    # apiKey: sk-xxx
  chunker:
    max-tokens: 256
    overlap-tokens: 80
    min-tokens: 32
  chat:
    # 留空则使用"抽取式回答"（直接展示检索到的段落）
    endpoint:
    model:
    apiKey:
    system-prompt: |
      你是 z-kb 知识库助手，基于以下参考资料回答用户问题。
      当参考资料不足时，明确告知用户。
      回答时请标注引用源编号，例如 [1] [2]。
      回答简洁准确，避免无中生有。

# ==================== Knife4j ====================
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    swagger-model-name: 数据模型

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.zifang.z.kb: DEBUG
    com.zifang.z.vector: INFO
    com.zifang.z.graph: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
