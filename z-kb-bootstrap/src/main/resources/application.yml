server:
  port: 8889
  servlet:
    context-path: /
  compression:
    enabled: true

spring:
  application:
    name: z-***REMOVED***
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # ==================== 数据源（2026-11-01 补） ====================
  # standalone 原来**没有**任何 datasource 配置 ⇒ 容器里没有 DataSource ⇒
  # 资源域整块（生命周期 / 成员 ACL / 配置版本 / 物料 / 编译 / 评测 / Wiki /
  # 接入源 / 审计）自动装配条件（@ConditionalOnBean(DataSource.class)）恒不成立 ⇒
  # 资源域 v1 的 18 个 Controller 全部不注册。
  # 这里给一份 H2 文件库（MySQL 兼容模式，与仓内集成测试同口径）：
  # 持久化到 ~/.z***REMOVED***/h2，重启不丢；想换成真 MySQL 只需覆盖 spring.datasource.* 四项。
  datasource:
    url: jdbc:h2:file:${user.home}/.z***REMOVED***/h2/z***REMOVED***;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

# ==================== z-***REMOVED*** 配置 ====================
z***REMOVED***:
  enabled: true
  embedding:
    # tfidf = 本地 TF-IDF 实现（自包含，离线可用）
    # http  = 调用 OpenAI/Qwen/GLM 等兼容端点
    provider: tfidf
    dimension: 512
    # endpoint: http://localhost:11434/v1/embeddings   # Ollama 示例
    # model: nomic-embed-text
    # apiKey: sk-xxx
  chunker:
    max-tokens: 256
    overlap-tokens: 80
    min-tokens: 32
  chat:
    # 留空则使用"抽取式回答"（直接展示检索到的段落）
    endpoint:
    model:
    apiKey:
    system-prompt: |
      你是 z-***REMOVED*** 知识库助手，基于以下参考资料回答用户问题。
      当参考资料不足时，明确告知用户。
      回答时请标注引用源编号，例如 [1] [2]。
      回答简洁准确，避免无中生有。

# ==================== Knife4j ====================
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    swagger-model-name: 数据模型

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.zifang.z.***REMOVED***: DEBUG
    com.zifang.z.vector: INFO
    com.zifang.z.graph: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
